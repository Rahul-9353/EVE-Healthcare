services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: eve_user
      POSTGRES_PASSWORD: eve_pass
      POSTGRES_DB: eve_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve_user -d eve_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://eve_user:eve_pass@db:5432/eve_db
      JWT_SECRET: change-this-to-a-long-random-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      PAYMENT_SUCCESS_RATE: "0.8"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/code

volumes:
  pgdata: